apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuroomics-backend-hpa
  namespace: neuroomics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuroomics-backend
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neuroomics-worker-hpa
  namespace: neuroomics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neuroomics-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
