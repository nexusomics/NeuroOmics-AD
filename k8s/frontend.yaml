apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroomics-frontend
  namespace: neuroomics
spec:
  replicas: 2
  selector:
    matchLabels: { app: neuroomics-frontend }
  template:
    metadata:
      labels: { app: neuroomics-frontend }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/neuroomics-ad-frontend:latest
          ports:
            - { containerPort: 80, name: http }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: neuroomics-frontend
  namespace: neuroomics
spec:
  selector: { app: neuroomics-frontend }
  ports:
    - { port: 80, targetPort: 80, name: http }
