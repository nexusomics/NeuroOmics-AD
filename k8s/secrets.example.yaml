# Copy to secrets.yaml, fill values, and `kubectl apply -f`.
# Never commit real secrets. Prefer an external secret store (Vault, SealedSecrets).
apiVersion: v1
kind: Secret
metadata:
  name: neuroomics-secrets
  namespace: neuroomics
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_64_char_random"
  POSTGRES_PASSWORD: "CHANGE_ME"
  ADMIN_PASSWORD: "CHANGE_ME"
  ASSISTANT_API_KEY: ""          # optional: OpenAI-compatible key
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
