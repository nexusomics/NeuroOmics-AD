apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neuroomics-ingress
  namespace: neuroomics
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [neuroomics.example.org]
      secretName: neuroomics-tls
  rules:
    - host: neuroomics.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neuroomics-frontend
                port: { number: 80 }
