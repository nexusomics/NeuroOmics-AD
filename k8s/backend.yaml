apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroomics-backend
  namespace: neuroomics
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: neuroomics-backend }
  template:
    metadata:
      labels: { app: neuroomics-backend }
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/your-org/neuroomics-ad-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: neuroomics-config }
            - secretRef: { name: neuroomics-secrets }
      containers:
        - name: api
          image: ghcr.io/your-org/neuroomics-ad-backend:latest
          args: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          envFrom:
            - configMapRef: { name: neuroomics-config }
            - secretRef: { name: neuroomics-secrets }
          ports:
            - { containerPort: 8000, name: http }
          volumeMounts:
            - { name: media, mountPath: /app/media }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "4", memory: "8Gi" }
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: neuroomics-media
---
apiVersion: v1
kind: Service
metadata:
  name: neuroomics-backend
  namespace: neuroomics
spec:
  selector: { app: neuroomics-backend }
  ports:
    - { port: 8000, targetPort: 8000, name: http }
