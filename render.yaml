# ==========================================================================
# Render Blueprint — deploy the whole platform with one click.
#  1. Push this repo to GitHub.
#  2. In Render: New → Blueprint → connect the repo.
#  3. Render provisions the Postgres + web service automatically.
# Result: permanent URL like https://neuroomics-ad.onrender.com
# ==========================================================================

databases:
  - name: neuroomics-db
    plan: free           # free tier; upgrade later if needed
    databaseName: neuroomics
    user: neuroomics

services:
  - type: web
    name: neuroomics-ad
    runtime: docker
    dockerfilePath: ./render.Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: TASK_ALWAYS_EAGER
        value: "true"          # analyses run inline (no Redis needed on free tier)
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@neuroomics.org
      - key: ADMIN_PASSWORD
        generateValue: true    # copy from the Render dashboard after first deploy
      - key: ASSISTANT_MODE
        value: local
      - key: STORAGE_BACKEND
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: neuroomics-db
          property: connectionString
